name: Sanitizers

# Runs the package tests with AddressSanitizer and UndefinedBehaviorSanitizer
# (the same configurations CRAN uses) in the rocker r-devel-san images.

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "R/**"
      - "tests/**"
      - "DESCRIPTION"
      - ".github/workflows/sanitizers.yml"
  pull_request:
  workflow_dispatch:

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    name: ${{ matrix.config.name }}
    container:
      image: ${{ matrix.config.image }}
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "gcc ASAN/UBSAN", image: "rocker/r-devel-san", rbin: "RDsan" }
          - { name: "clang ASAN/UBSAN", image: "rocker/r-devel-ubsan-clang", rbin: "RDcsan" }

    env:
      ASAN_OPTIONS: "detect_leaks=0:detect_odr_violation=0:abort_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      R_BIN: ${{ matrix.config.rbin }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          $R_BIN -q -e 'install.packages(c("testthat"), repos = "https://cloud.r-project.org")'

      - name: Install package
        run: $R_BIN CMD INSTALL --no-docs --no-test-load .

      - name: Run tests
        run: |
          cd tests
          $R_BIN -q -f testthat.R

  valgrind:
    runs-on: ubuntu-latest
    name: valgrind
    container:
      image: rocker/r-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind and dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends valgrind
          RD -q -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Install package
        run: RD CMD INSTALL --no-docs --no-test-load .

      - name: Run tests under valgrind
        run: |
          cd tests
          RD -d "valgrind --leak-check=full --show-leak-kinds=definite --error-exitcode=1 --track-origins=yes" --vanilla -f testthat.R
